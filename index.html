<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="icon" type="image/x-icon" href="./assets/icon.png" />
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    
    <div class="container">
        <div class="pop-up">
            <br>
            <h2>Press start</h2><br><br>
            <button class="start" onclick="startGame()">Start</button>
        </div>
        <br><br>
        <h1 class="tities">Guess the word</h1>
        <br>
        <button id="giveUp">Give Up</button>
        <br><br>
        <div class="grid">
            <!-- First Guess -->
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>

            <!-- Second Guess -->
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>

            <!-- Third Guess -->
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>

            <!-- Fourth Guess -->
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>

            <!-- Fifth Guess -->
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>

            <!-- Sixth Guess -->
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
            <input class="tile" readonly>
        </div>
        
        <div class="keyboard">
            <div class="key-row">
                <button class="key">q</button>
                <button class="key">w</button>
                <button class="key">e</button>
                <button class="key">r</button>
                <button class="key">t</button>
                <button class="key">y</button>
                <button class="key">u</button>
                <button class="key">i</button>
                <button class="key">o</button>
                <button class="key">p</button>
            </div>

            <div class="key-row">
                <button class="key">a</button>
                <button class="key">s</button>
                <button class="key">d</button>
                <button class="key">f</button>
                <button class="key">g</button>
                <button class="key">h</button>
                <button class="key">j</button>
                <button class="key">k</button>
                <button class="key">l</button>
            </div>

            <div class="key-row">
                <button class="key wide" data-key="enter">Enter</button>
                <button class="key">z</button>
                <button class="key">x</button>
                <button class="key">c</button>
                <button class="key">v</button>
                <button class="key">b</button>
                <button class="key">n</button>
                <button class="key">m</button>
                <button class="key wide" data-key="backspace">⌫</button>
            </div>
        </div> 
    </div>
    <br><br><br>

    <div class="bottom">
        <footer class="footer">
            <div class="footer-content">
                <span>© 2026 Chris Paredes</span>

                <div class="socials">
                    <a href="https://web.facebook.com/ThomasDeLaMort/"><i class="bi bi-facebook"></i></a>
                    <a href="https://www.instagram.com/__neallll__/?hl=en"><i class="bi bi-instagram"></i></a>
                    <a href="https://github.com/ThomasDelamort"><i class="bi bi-github"></i></a>
                </div>
            </div>
        </footer>
    </div>
        
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./index.js"></script>
</body>
</html>
